general {
    lock_cmd = pidof hyprlock || hyprlock       # nur eine Instanz starten
    before_sleep_cmd = loginctl lock-session    # vor dem Standby sperren
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' # nach dem Aufwachen Bildschirm an
}

listener {
    timeout = 300                               # nach 5 Minuten
    on-timeout = loginctl lock-session          # sperren
}

listener {
    timeout = 330                                      # nach 5,5 Minuten
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")' # Bildschirm aus
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'   # bei Aktivität wieder an
}

listener {
    timeout = 1800                              # nach 30 Minuten
    on-timeout = systemctl suspend              # Standby
}
